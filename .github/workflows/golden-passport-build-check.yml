name: Golden Passport Build Check

on:
  push:
    branches:
      - build/golden-passport-game-v0-1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Golden Passport artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/golden-passport-game.json
          jq -e '.game_id == "JASONS_GOLDEN_PASSPORT_GAME_V0_1"' frontend/dist/golden-passport-game.json
          jq -e '.denominator.required == 5' frontend/dist/golden-passport-game.json
          jq -e '[.seats[] | select(.state == "PASS")] | length == 5' frontend/dist/golden-passport-game.json
