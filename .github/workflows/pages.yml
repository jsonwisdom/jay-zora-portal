name: Deploy GitHub Pages

on:
  push:
    branches:
      - live-zora-ingestion
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Refresh public Zora inventory
        run: |
          node tools/refresh-zora-from-public.mjs

      - name: Verify live inventory
        run: |
          test -f data/live_zora_items.json
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('data/live_zora_items.json','utf8')); if(!Array.isArray(rows)) throw new Error('live_zora_items is not an array'); if(rows.length < 2) throw new Error('live inventory unexpectedly small'); console.log('LIVE_ZORA_COUNT=' + rows.length);"

      - name: Sync real Zora dataset into public index
        run: |
          mkdir -p frontend/public
          cp data/live_zora_items.json frontend/public/zora-index.json
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('frontend/public/zora-index.json','utf8')); if(!Array.isArray(rows)) throw new Error('zora-index is not an array'); if(rows.length < 2) throw new Error('zora-index did not sync real dataset'); console.log('ZORA_INDEX_COUNT=' + rows.length);"

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Verify artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/zora-index.json
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('frontend/dist/zora-index.json','utf8')); if(!Array.isArray(rows)) throw new Error('dist zora-index is not an array'); if(rows.length < 2) throw new Error('dist zora-index has seed-only count'); console.log('DIST_ZORA_INDEX_COUNT=' + rows.length);"
          find frontend/dist -maxdepth 2 -type f | sort

      - name: Commit refreshed inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_zora_items.json frontend/public/zora-index.json
          git diff --cached --quiet || git commit -m "Daily Zora inventory refresh"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
