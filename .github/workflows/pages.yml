name: Deploy GitHub Pages

on:
  push:
    branches:
      - live-zora-ingestion
      - feat/zora-inventory-manifest
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Zora SDK dependencies
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Pull live Zora inventory through SDK
        env:
          ZORA_IDENTIFIER: jaywisdom.base.eth
          ZORA_COUNT: "50"
          ZORA_API_KEY: ${{ secrets.ZORA_API_KEY }}
        run: node tools/export_zora_profile_coins.mjs

      - name: Verify live Zora pull
        run: |
          COUNT=$(jq 'length' data/live_zora_items.json)
          echo "LIVE_ZORA_ITEM_COUNT=$COUNT"
          test "$COUNT" -ge 300
          test -s discovery/zora/latest_profile_coins_response.json
          test -s discovery/zora/latest_profile_coins_edges.json

      - name: Sync real Zora dataset into public index
        run: |
          mkdir -p frontend/public
          cp data/live_zora_items.json frontend/public/zora-index.json
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('frontend/public/zora-index.json','utf8')); if(!Array.isArray(rows)) throw new Error('zora-index is not an array'); if(rows.length < 300) throw new Error('zora-index did not sync full live dataset'); console.log('ZORA_INDEX_COUNT=' + rows.length);"

      - name: Generate inventory manifest
        run: |
          INDEX_PATH="frontend/public/zora-index.json"
          MANIFEST_PATH="frontend/public/zora-inventory-manifest.json"

          SHA256=$(sha256sum "$INDEX_PATH" | cut -d' ' -f1)
          COUNT=$(jq 'length' "$INDEX_PATH")

          jq -n \
            --arg sha "$SHA256" \
            --argjson count "$COUNT" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source "https://zora.co/@jaywisdom" \
            --arg commit "$GITHUB_SHA" \
            --arg script "tools/export_zora_profile_coins.mjs" \
            '{
              schema: "zora-inventory-manifest-v1",
              dataset_sha256: $sha,
              item_count: $count,
              generated_at: $generated,
              source_profile: $source,
              workflow_commit: $commit,
              refresh_script: $script,
              source_mode: "@zoralabs/coins-sdk:getProfileCoins",
              gate: {
                min_items: 300,
                result: (if $count >= 300 then "PASS" else "FAIL" end)
              },
              notes: "Fresh SDK observation. Byte binding only; no external authority created."
            }' > "$MANIFEST_PATH"

          echo "MANIFEST_WRITTEN dataset_sha256=$SHA256 item_count=$COUNT"

      - name: Verify manifest binding
        run: |
          INDEX_PATH="frontend/public/zora-index.json"
          MANIFEST_PATH="frontend/public/zora-inventory-manifest.json"

          RECOMPUTED=$(sha256sum "$INDEX_PATH" | cut -d' ' -f1)
          DECLARED=$(jq -r '.dataset_sha256' "$MANIFEST_PATH")
          COUNT=$(jq 'length' "$INDEX_PATH")
          DECLARED_COUNT=$(jq -r '.item_count' "$MANIFEST_PATH")
          COMMIT=$(jq -r '.workflow_commit' "$MANIFEST_PATH")
          GATE_RESULT=$(jq -r '.gate.result' "$MANIFEST_PATH")

          test "$RECOMPUTED" = "$DECLARED"
          test "$COUNT" = "$DECLARED_COUNT"
          test "$COMMIT" = "$GITHUB_SHA"
          test "$GATE_RESULT" = "PASS"

          echo "Manifest binding verified"
          echo "  dataset_sha256=$RECOMPUTED"
          echo "  item_count=$COUNT"
          echo "  workflow_commit=$COMMIT"

      - name: Build JaySpace2026 static site
        working-directory: frontend
        run: npm run build

      - name: Verify artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/zora-index.json
          test -f frontend/dist/zora-inventory-manifest.json

          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('frontend/dist/zora-index.json','utf8')); if(!Array.isArray(rows)) throw new Error('dist zora-index is not an array'); if(rows.length < 300) throw new Error('dist zora-index has incomplete live count'); console.log('DIST_ZORA_INDEX_COUNT=' + rows.length);"

          RECOMPUTED=$(sha256sum frontend/dist/zora-index.json | cut -d' ' -f1)
          DECLARED=$(jq -r '.dataset_sha256' frontend/dist/zora-inventory-manifest.json)
          COUNT=$(jq 'length' frontend/dist/zora-index.json)
          DECLARED_COUNT=$(jq -r '.item_count' frontend/dist/zora-inventory-manifest.json)

          test "$RECOMPUTED" = "$DECLARED"
          test "$COUNT" = "$DECLARED_COUNT"

          echo "Dist manifest binding verified"
          echo "  dataset_sha256=$RECOMPUTED"
          echo "  item_count=$COUNT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.ref == 'refs/heads/live-zora-ingestion'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
