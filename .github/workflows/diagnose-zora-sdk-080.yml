name: Diagnose Zora Current Profile Surface

on:
  push:
    branches:
      - live-zora-ingestion
    paths:
      - ".github/workflows/diagnose-zora-sdk-080.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: live-zora-ingestion

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Overlay current Zora SDK 0.8.0
        run: npm install --no-save --package-lock=false @zoralabs/coins-sdk@0.8.0

      - name: Print effective SDK version
        run: node -e "console.log('ZORA_SDK_VERSION=' + require('./node_modules/@zoralabs/coins-sdk/package.json').version)"

      - name: Pull profile coins secondary witness
        env:
          ZORA_IDENTIFIER: jaywisdom.base.eth
          ZORA_COUNT: "50"
        run: node tools/export_zora_profile_coins.mjs

      - name: Report coin freshness
        run: |
          echo "COUNT=$(jq 'length' data/live_zora_items.json)"
          echo "NEWEST_10_COINS"
          jq -r 'sort_by(.created_at // "") | reverse | .[0:10][] | [.created_at,.title,.contract] | @tsv' data/live_zora_items.json

      - name: Enumerate Zora profile posts canonical rail in chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/zora-posts-all.ndjson
          cursor=""
          page=1
          while true; do
            args=(profile posts jaywisdom --limit 20 --json)
            if [ -n "$cursor" ]; then
              args+=(--after "$cursor")
            fi
            npx -y @zoralabs/cli@1.9.2 "${args[@]}" > "/tmp/zora-posts-${page}.json"
            count=$(jq '.posts | length' "/tmp/zora-posts-${page}.json")
            has_next=$(jq -r '.pageInfo.hasNextPage // false' "/tmp/zora-posts-${page}.json")
            next_cursor=$(jq -r '.pageInfo.endCursor // empty' "/tmp/zora-posts-${page}.json")
            echo "POSTS_PAGE=${page} COUNT=${count} HAS_NEXT_PAGE=${has_next} END_CURSOR=$([ -n "$next_cursor" ] && echo present || echo absent)"
            jq -c '.posts[]' "/tmp/zora-posts-${page}.json" >> /tmp/zora-posts-all.ndjson
            if [ "$has_next" != "true" ]; then
              break
            fi
            if [ -z "$next_cursor" ]; then
              echo "ERROR: hasNextPage=true but endCursor absent" >&2
              exit 2
            fi
            cursor="$next_cursor"
            page=$((page + 1))
            if [ "$page" -gt 200 ]; then
              echo "ERROR: pagination safety ceiling reached" >&2
              exit 3
            fi
          done
          echo "TOTAL_POSTS=$(wc -l < /tmp/zora-posts-all.ndjson)"
          echo "FINAL_HAS_NEXT_PAGE=false"
          echo "KAREN11_FILTERED"
          jq -sc '[.[] | select((((.name // "") + " " + (.symbol // "")) | ascii_downcase | test("karen11|k11|karen"))) | {rank,name,symbol,address,createdAt,coinType}]' /tmp/zora-posts-all.ndjson
