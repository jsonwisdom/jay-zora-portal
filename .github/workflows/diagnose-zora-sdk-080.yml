name: Diagnose Zora Current Profile Surface

on:
  push:
    branches:
      - live-zora-ingestion
    paths:
      - ".github/workflows/diagnose-zora-sdk-080.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: live-zora-ingestion

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Overlay current Zora SDK 0.8.0
        run: npm install --no-save --package-lock=false @zoralabs/coins-sdk@0.8.0

      - name: Print effective SDK version
        run: node -e "console.log('ZORA_SDK_VERSION=' + require('./node_modules/@zoralabs/coins-sdk/package.json').version)"

      - name: Pull profile coins secondary witness
        env:
          ZORA_IDENTIFIER: jaywisdom.base.eth
          ZORA_COUNT: "50"
        run: node tools/export_zora_profile_coins.mjs

      - name: Report coin freshness
        run: |
          echo "COUNT=$(jq 'length' data/live_zora_items.json)"
          echo "NEWEST_10_COINS"
          jq -r 'sort_by(.created_at // "") | reverse | .[0:10][] | [.created_at,.title,.contract] | @tsv' data/live_zora_items.json

      - name: Enumerate Zora profile posts canonical rail
        run: |
          npx -y @zoralabs/cli@1.9.2 profile posts jaywisdom --limit 1000 --json > /tmp/zora-posts.json
          echo "POST_COUNT=$(jq '.posts | length' /tmp/zora-posts.json)"
          echo "HAS_NEXT_PAGE=$(jq -r '.pageInfo.hasNextPage' /tmp/zora-posts.json)"
          echo "KAREN11_FILTERED"
          jq -c '[.posts[] | select((((.name // "") + " " + (.symbol // "")) | ascii_downcase | test("karen11|k11|karen"))) | {rank,name,symbol,address,createdAt,coinType}]' /tmp/zora-posts.json
          echo "ALL_POSTS"
          jq -c '[.posts[] | {rank,name,symbol,address,createdAt,coinType}]' /tmp/zora-posts.json
