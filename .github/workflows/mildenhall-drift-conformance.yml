name: Mildenhall Drift Conformance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic drift cases
        run: node tools/test_cross_surface_drift.mjs tests/mildenhall/cross_surface_drift_cases_v0_1.json
